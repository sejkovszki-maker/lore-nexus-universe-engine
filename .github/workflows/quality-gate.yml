name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run quality:public
      - run: npm run language:check
      - run: New-Item -ItemType Directory -Force artifacts | Out-Null; npm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: artifacts/sbom.cdx.json
