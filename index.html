</head>
<body class="bg-[#0a0809] text-gray-200">
  <div id="file-protocol-warning" style="display: none; background: #8b0000; color: white; padding: 20px; text-align: center; font-family: sans-serif; font-size: 1.2rem; margin: 50px; border-radius: 10px;">
    <strong>FIGYELEM!</strong><br><br>
    Ezt a modern alkalmazást már nem lehet dupla kattintással (file:/// protokoll) megnyitni a mappából.<br>
    Kérlek nyisd meg a böngésződben a következőt: <br><br>
    <a href="http://localhost:5173/" style="color: #ffd700; font-size: 1.5rem; text-decoration: none;">http://localhost:5173/</a><br><br>
    (A Vite fejlesztői szervernek futnia kell a háttérben.)
  </div>

  <script>
    if (window.location.protocol === 'file:') {
      document.getElementById('file-protocol-warning').style.display = 'block';
    }
  </script>

  <!-- Vite Entry -->
